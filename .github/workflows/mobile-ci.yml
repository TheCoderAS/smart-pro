name: mobile CI

# Only run when the Flutter subproject or this workflow itself changes.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  # Manual trigger for publishing the rolling APK release from any branch.
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: analyze + test
    # PRs only. Everything reaches main through a PR, and it was verified
    # there -- re-running the same checks on the merge commit proves nothing
    # new and just delays the build people are waiting for.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Generated sources are not committed; produce them here.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --coverage

  build-android:
    name: build android
    # PRs only. This is the sole check that compiles the Kotlin, parses the
    # manifest and runs Gradle -- analyze+test never touches Android -- so it
    # has to run before a merge. On main it is pure duplication: the release
    # job builds the same release APK a second time.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: unisync-android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  build-ios:
    name: build ios (no codesign)
    # Paused. macOS runners bill at 10x, so this one job costs roughly as
    # much quota as everything else here put together -- and it only ever
    # proves the iOS side still compiles, which nothing currently ships.
    # Flip to `true` to bring it back before any iOS release.
    if: false
    runs-on: macos-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign

  release-android:
    name: publish rolling apk release
    # Rolling "mobile-latest" prerelease so the APK is downloadable without
    # digging through workflow-run artifacts.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # Deliberately no `needs`: on main this is the only job that runs, so
    # there is nothing to wait for. The verification happened on the PR.
    # Note this does mean a direct push to main -- bypassing a PR -- ships
    # an APK nothing checked.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # Version: the display version (X.Y.Z) comes from pubspec.yaml,
      # bumped per change; the Android build number (versionCode) is the
      # workflow run number, so it only ever grows and every published
      # APK installs cleanly over the previous one.
      - name: read version
        id: ver
        run: |
          name=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          echo "name=${name:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      # Per-ABI release APKs (the R8 work happens once for all three, so
      # this costs the same as one universal build at a third the download
      # size). The debug APK stays gone -- the in-app Logs screen works on
      # release builds. The .aab (Play Store format) is still built on a
      # manual workflow_dispatch, the only place it is needed.
      - run: flutter build apk --release --split-per-abi
          --build-number=${{ steps.ver.outputs.build }}
      - run: flutter build appbundle --release
          --build-number=${{ steps.ver.outputs.build }}
        if: github.event_name == 'workflow_dispatch'
      - name: publish versioned + rolling releases
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.name }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          apkdir=build/app/outputs/flutter-apk
          abis=(arm64-v8a armeabi-v7a x86_64)

          # 1. Permanent versioned release: one per publish, versioned
          # file names, so every build that ever reached a phone stays
          # downloadable and identifiable.
          tag="v${VER}-b${BUILD}"
          versioned=()
          for abi in "${abis[@]}"; do
            cp "$apkdir/app-$abi-release.apk" \
               "$apkdir/unisync-v${VER}-b${BUILD}-$abi.apk"
            versioned+=("$apkdir/unisync-v${VER}-b${BUILD}-$abi.apk")
          done
          gh release create "$tag" \
            --title "Unisync Android v${VER} (build ${BUILD})" \
            --notes "Most phones want the arm64-v8a APK. Built from ${GITHUB_SHA}." \
            "${versioned[@]}"

          # 2. Rolling mobile-latest: stable file names, clobbered every
          # publish, so the bookmark keeps working. `create` is a no-op
          # once the release exists, so edit-then-create keeps the notes
          # naming the build people actually download.
          notes="Latest build: v${VER} (build ${BUILD}), from ${GITHUB_SHA}. Most phones want app-arm64-v8a-release.apk. Older versions live in the v* releases."
          if gh release view mobile-latest >/dev/null 2>&1; then
            gh release edit mobile-latest --prerelease \
              --title "Unisync Android (rolling)" --notes "$notes"
          else
            gh release create mobile-latest --prerelease \
              --title "Unisync Android (rolling)" --notes "$notes"
          fi
          assets=()
          for abi in "${abis[@]}"; do
            assets+=("$apkdir/app-$abi-release.apk")
          done
          # Only when this run built one (workflow_dispatch). A push run
          # leaves the previously uploaded .aab in place.
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            assets+=(build/app/outputs/bundle/release/app-release.aab)
          fi
          gh release upload mobile-latest "${assets[@]}" --clobber
          # The universal APK is not built any more; drop the stale copy
          # so nobody installs an old build by picking the wrong asset.
          gh release delete-asset mobile-latest app-release.apk -y || true
