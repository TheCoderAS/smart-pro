name: mobile CI

# Only run when the Flutter subproject or this workflow itself changes.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  # Manual trigger for publishing the rolling APK release from any branch.
  workflow_dispatch:

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Generated sources are not committed; produce them here.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test --coverage

  build-android:
    name: build android
    runs-on: ubuntu-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: unisync-android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  build-ios:
    name: build ios (no codesign)
    runs-on: macos-latest
    needs: analyze-test
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign

  release-android:
    name: publish rolling apk release
    # Rolling "mobile-latest" prerelease so the APK is downloadable without
    # digging through workflow-run artifacts.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      # Per-ABI APKs are ~1/3 the size of the universal one; most phones
      # want app-arm64-v8a-release.apk.
      - run: flutter build apk --release --split-per-abi
      # A debug build alongside, for bench work: it keeps the logging the
      # release build strips, which is what you want when diagnosing a
      # device rather than using one. Signed with the debug key, so it will
      # not install over the release APK -- uninstall first.
      - run: flutter build apk --debug
      - name: publish to mobile-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Rebuilt on every mobile change. Most phones want app-arm64-v8a-release.apk; app-release.apk is the universal fallback. app-debug.apk keeps the logging the release build strips -- use it for bench diagnosis, and note it is debug-signed so it will not install over a release build (uninstall first). Built from ${GITHUB_SHA}."
          # `create` is a no-op once the release exists, so the notes used
          # to freeze at whatever commit first published them while the
          # assets kept updating -- the description named a build nobody
          # was downloading. Edit when it is already there.
          if gh release view mobile-latest >/dev/null 2>&1; then
            gh release edit mobile-latest --prerelease \
              --title "Unisync Android (rolling)" --notes "$notes"
          else
            gh release create mobile-latest --prerelease \
              --title "Unisync Android (rolling)" --notes "$notes"
          fi
          gh release upload mobile-latest \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk \
            build/app/outputs/flutter-apk/app-debug.apk --clobber
