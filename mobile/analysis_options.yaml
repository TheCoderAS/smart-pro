# Analyzer configuration for the Unisync app.
#
# flutter_lints plus the stricter options called for by mobile/PLAN.md §4:
# strict type checks and a handful of rules that keep the codebase honest
# as features land. CI treats analyzer output as fatal (PLAN.md §10).

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Analyzer infos/warnings fail CI; make intent explicit locally too.
    unused_import: error
    dead_code: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - unnecessary_lambdas
