name: unisync
description: "Unisync — control your switches. Local-first companion app for Unisync masters and extensions."
publish_to: 'none'

# versionName / CFBundleShortVersionString + versionCode / CFBundleVersion
# The display version (X.Y.Z) is bumped here with every app-changing PR.
# The Android build number (versionCode) is stamped by CI from the run
# number (--build-number), so every published APK upgrades cleanly over
# the previous one; the +1 below only covers local builds.
version: 1.5.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # State management — Riverpod 3, hand-written notifiers (no codegen:
  # riverpod_generator's analyzer pins currently conflict with
  # web_socket_channel 3.x; see mobile/PLAN.md §3 note).
  flutter_riverpod: ^3.4.2
  # Declarative routing
  go_router: ^17.4.0
  # HTTP to the master (X-Auth interceptor, multipart OTA uploads)
  dio: ^5.11.0
  # Live state socket, ws://192.168.4.1:81/ws
  web_socket_channel: ^3.0.3
  # Token storage — Keychain / EncryptedSharedPreferences
  flutter_secure_storage: ^11.0.0
  # Non-secret prefs: theme, last-used master UID
  shared_preferences: ^2.5.5
  # HMAC-SHA256 for BLE recovery challenge
  crypto: ^3.0.7
  # Hex codec for recovery keys
  convert: ^3.1.2
  # Structured dev logging; silent in release
  logger: ^2.7.0
  # Real installed version for the About tile — never hardcoded
  package_info_plus: ^10.2.1
  # Immutable models + JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  # Join the master's AP — WifiNetworkSuggestion / NEHotspotConfiguration
  # Android Wi-Fi scanning for onboarding (iOS cannot scan; manual entry)
  wifi_scan: ^0.4.1+2
  # Runtime permission prompts (BLE split, NEARBY_WIFI_DEVICES)
  permission_handler: ^13.0.0
  flutter_reactive_ble: ^5.5.0
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_animate: ^4.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  # Regenerates the launcher icons from assets/branding — run
  # `dart run flutter_launcher_icons` after changing the artwork; the
  # generated mipmaps are committed.
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700

# Launcher icon (logos/app_icon_unisync.png): the full mark, uncropped,
# on white — by request. The adaptive foreground is the same image padded
# so Android's mask never crops it. iOS is off with the paused iOS build.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
