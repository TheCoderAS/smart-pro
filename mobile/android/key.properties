# Committed TESTING signing key (team decision) so every rolling
# `mobile-latest` APK carries the SAME signature and installs as an
# in-place update instead of failing with a signature mismatch.
#
# This is NOT a secret and NOT for the Play Store — the key material is
# public in the repo. Rotate to a real release key (via CI secrets,
# key.properties untracked) before any production/Play release.
storeFile=app/testing-release.keystore
storePassword=unisynctest
keyAlias=unisync
keyPassword=unisynctest
